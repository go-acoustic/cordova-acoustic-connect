# Publish capacitor-acoustic-connect to npm using npm Trusted Publishers (OIDC).
#
# Note for maintainers: this file is the SOURCE for the public repo's
# `.github/workflows/publish-capacitor.yml`. The release pipeline copies it there under
# that name on every production publish — edits made directly in the public
# repo are overwritten. In this (private) repo the workflow is inert: the
# repository guard below only matches the public repo.
#
# Flow:
#   1. Jenkins syncs the repository to go-acoustic/cordova-acoustic-connect, renames the
#      Capacitor plugin to capacitor-acoustic-connect (scripts/capacitor-release-names.sh),
#      builds its dist/, runs `npm pack`, and pushes the tag capacitor-<version>
#      (e.g. capacitor-1.0.0) to that repo.
#   2. Jenkins uploads the tarball as a GitHub Release asset.
#   3. This workflow triggers on the tag push, waits for the tarball asset,
#      downloads it, and publishes to npm via OIDC — no npm token stored in GitHub.
#
# publish.yml (the Cordova release) ignores capacitor-* tags: it takes bare semver tags only.
#
# Prerequisites:
#   - npm package `capacitor-acoustic-connect` configured with GitHub as a
#     Trusted Publisher on npmjs.com:
#       repository: go-acoustic/cordova-acoustic-connect
#       workflow:   publish-capacitor.yml
#   - npm CLI >= 11.5.1 (upgraded automatically in this workflow)
#
# Troubleshooting:
#   - "Timeout": Jenkins did not upload the tarball to the GitHub Release in time
#   - "npm publish failed": verify Trusted Publishers config on npmjs.com

name: Publish Capacitor to npm (Trusted Publishers)

on:
  push:
    tags:
      - 'capacitor-*'
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC Trusted Publishers
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only publish from the public repository — inert everywhere else.
    if: github.repository == 'go-acoustic/cordova-acoustic-connect'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^capacitor-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: '${TAG}' is not a capacitor-<bare semver> tag — aborting." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for Trusted Publishers
        timeout-minutes: 3
        run: |
          set -euo pipefail
          echo "Current npm version: $(npm --version)"
          npm install -g npm@11
          echo "Upgraded npm version: $(npm --version)"

      - name: Download tarball from release
        id: download
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PLUGIN_PKG="plugins/capacitor-acoustic-connect/package.json"
          VERSION=$(jq -r '.version' "$PLUGIN_PKG")

          PACKAGE_NAME=$(jq -r '.name' "$PLUGIN_PKG")
          if [ "$PACKAGE_NAME" != "capacitor-acoustic-connect" ]; then
            echo "ERROR: unexpected package name '${PACKAGE_NAME}'" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: version '${VERSION}' from package.json is not a bare semver string" >&2
            exit 1
          fi
          if [ "capacitor-${VERSION}" != "$RELEASE_TAG" ]; then
            echo "ERROR: tag '${RELEASE_TAG}' does not match package.json version '${VERSION}'" >&2
            exit 1
          fi

          TARBALL="capacitor-acoustic-connect-${VERSION}.tgz"
          echo "Version : $VERSION"
          echo "Tarball : $TARBALL"

          # Wait for Jenkins to upload the tarball asset to the GitHub Release.
          MAX_RETRIES=36  # 36 × 10s = 6 minutes
          RETRY_DELAY=10
          attempt=1

          while [ $attempt -le $MAX_RETRIES ]; do
            echo "Attempt $attempt/$MAX_RETRIES — checking for ${TARBALL}..."

            # A 404 (release not yet created) falls back to an empty asset list and the loop continues.
            RELEASE_JSON=$(gh release view "$RELEASE_TAG" \
              --repo "$REPO" \
              --json assets 2>/dev/null) || RELEASE_JSON='{"assets":[]}'
            ASSET_COUNT=$(echo "$RELEASE_JSON" \
              | jq --arg name "$TARBALL" '[(.assets // [])[] | select(.name == $name)] | length')

            if [ "${ASSET_COUNT}" -ge 1 ]; then
              echo "Asset found — downloading."
              gh release download "$RELEASE_TAG" \
                --repo "$REPO" \
                --pattern "$TARBALL"
              break
            fi

            if [ $attempt -eq $MAX_RETRIES ]; then
              echo "Timeout: ${TARBALL} not attached to release ${RELEASE_TAG} after $((MAX_RETRIES * RETRY_DELAY))s" >&2
              exit 1
            fi

            sleep $RETRY_DELAY
            attempt=$((attempt + 1))
          done

          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tarball
        env:
          TARBALL: ${{ steps.download.outputs.tarball }}
        run: |
          set -euo pipefail
          echo "--- Contents (first 30 entries) ---"
          tar -tzf "$TARBALL" | head -30
          # The tarball must carry the built dist/: it is not in git.
          tar -tzf "$TARBALL" | grep -q '^package/dist/plugin.cjs.js$'
          echo "--- Size ---"
          ls -lh "$TARBALL"

      - name: Publish to npm
        timeout-minutes: 5
        env:
          TARBALL: ${{ steps.download.outputs.tarball }}
        run: |
          set -euo pipefail
          # Public repo — provenance attestation enabled (npm >= 11.5.1).
          NPM_CONFIG_PROVENANCE=true npm publish "$TARBALL" \
            --access public \
            --tag latest \
            --provenance \
            --verbose

      - name: Job summary
        if: always()
        env:
          TARBALL: ${{ steps.download.outputs.tarball }}
          VERSION: ${{ steps.download.outputs.version }}
          TAG:     ${{ github.ref_name }}
          REPO:    ${{ github.repository }}
        run: |
          {
            echo "# npm publish results"
            echo ""
            echo "**Package:** capacitor-acoustic-connect@${VERSION}"
            echo "**Tarball:** \`${TARBALL}\`"
            echo "**Tag:** \`${TAG}\`"
            echo "**Repository:** ${REPO}"
          } >> "$GITHUB_STEP_SUMMARY"
