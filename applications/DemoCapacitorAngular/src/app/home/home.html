<div class="demo-page">
  <header>
    <h1>ACOUSTIC</h1>
    <p class="page-title">{{ titles[tab()] }}</p>
    <p class="status ready" id="deviceready">Capacitor ready · {{ acoustic.platform }}</p>
    <p class="version-info">{{ acoustic.versionInfo() }}</p>
  </header>

  <div class="tab-content active">
    @switch (tab()) {
      @case ('notification') { <app-notification-tab /> }
      @case ('identity') { <app-identity-tab /> }
      @case ('behaviour') { <app-behaviour-tab /> }
    }
  </div>

  <nav class="tab-bar" aria-label="Main navigation">
    <button class="tab-btn" [class.active]="tab() === 'notification'" id="tab_notification" aria-label="Notification" (click)="select('notification')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6V11c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5S10.5 3.17 10.5 4v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
      </svg>
      <span class="tab-label">Notification</span>
    </button>
    <button class="tab-btn" [class.active]="tab() === 'identity'" id="tab_identity" aria-label="Identity" (click)="select('identity')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 12c2.21 0 4-1.79 4-4S14.21 4 12 4 8 5.79 8 8s1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
      <span class="tab-label">Identity</span>
    </button>
    <button class="tab-btn" [class.active]="tab() === 'behaviour'" id="tab_behaviour" aria-label="Behaviour" (click)="select('behaviour')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/>
      </svg>
      <span class="tab-label">Behaviour</span>
    </button>
  </nav>
</div>
